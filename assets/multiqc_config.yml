title: "fatq-vcf germline pipeline report"
subtitle: "FASTQ → GRCh38 → GATK HaplotypeCaller (DRAGEN mode) · mito · SV/CNV"
report_comment: >
  Generated by fatq-vcf. Tool versions are pinned in conf/containers.config.

show_analysis_paths: false
show_analysis_time: true

run_modules:
  - fastp
  - fastqc
  - samtools
  - mosdepth
  - picard
  - gatk
  - verifybamid
  - somalier
  - bcftools
  - custom_content

module_order:
  - fastp
  - fastqc
  - samtools
  - mosdepth
  - picard
  - verifybamid
  - somalier
  - gatk
  - bcftools

table_columns_visible:
  samtools:
    reads_mapped_percent: true
    error_rate: false
  mosdepth:
    median_coverage: true
    30_x_pc: true

extra_fn_clean_exts:
  - ".recal"
  - ".markdup"
  - ".filtered"
  - "_fastp"
